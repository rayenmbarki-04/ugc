<div class="signup-container">
  <div class="signup-card">
    <h1>Sign Up - Creator</h1>

    <!-- Step 1: Common info -->
    <form *ngIf="step === 1" (ngSubmit)="proceedToStep2()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="step1Data.name" name="name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="step1Data.email" name="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="step1Data.password" name="password" required />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="step1Data.confirmPassword" name="confirmPassword" required />
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="step1Data.role" name="role" required>
          <option value="user">User</option>
          <option value="micro_influencer">Micro-Influencer</option>
          <option value="influencer">Influencer</option>
        </select>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button type="submit">Next</button>
    </form>

    <!-- Step 2: Creator common fields -->
    <form *ngIf="step === 2" (ngSubmit)="onSignup()">
      <h2>Creator Profile Info</h2>

      <div class="form-group">
        <label>Age</label>
        <input type="number" [(ngModel)]="creatorData.age" name="age" required />
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" [(ngModel)]="creatorData.location" name="location" required />
      </div>
<!-- Interests -->
<div class="form-group">
  <label>Interests</label>
  <div class="multi-select">
    <label *ngFor="let interest of allInterests">
      <input type="checkbox" [value]="interest" (change)="toggleSelection(creatorData.interests, $event)" />
      <span>{{ interest }}</span>
    </label>
  </div>
</div>

<div class="form-group">
  <label>Platforms</label>
  <div class="multi-select">
    <label *ngFor="let platform of allPlatforms">
      <input type="checkbox" [value]="platform" (change)="toggleSelection(creatorData.platforms, $event)" />
      <span>{{ platform }}</span>
    </label>
  </div>
</div>

<div class="form-group">
  <label>Preferred Content Types</label>
  <div class="multi-select">
    <label *ngFor="let type of allContentTypes">
      <input type="checkbox" [value]="type" (change)="toggleSelection(creatorData.preferred_content_types, $event)" />
      <span>{{ type }}</span>
    </label>
  </div>
</div>

      

      <div class="form-group">
        <label>Daily Time on Social Media</label>
        <input type="text" [(ngModel)]="creatorData.daily_time" name="daily_time" placeholder="e.g. 3h" />
      </div>

      

      <div class="form-group">
        <label>Instagram Link</label>
        <input type="text" [(ngModel)]="creatorData.instagram_link" name="instagram_link" required />
      </div>

      <div class="form-group">
        <label>TikTok Link</label>
        <input type="text" [(ngModel)]="creatorData.tiktok_link" name="tiktok_link" required />
      </div>

      <div class="form-group">
        <label>YouTube Link (optional)</label>
        <input type="text" [(ngModel)]="creatorData.youtube_link" name="youtube_link" />
      </div>

      <!-- Step 3: Role-specific fields -->
      <div *ngIf="isMicroInfluencer()">
        <h2>Micro-Influencer Details</h2>

        <div class="form-group">
          <label>Years Creating Content</label>
          <input type="number" [(ngModel)]="microInfluencerData.content_experience_years" name="content_experience_years" />
        </div>

        <div class="form-group">
          <label>Main Goal</label>
          <input type="text" [(ngModel)]="microInfluencerData.main_goal" name="main_goal" />
        </div>

        <div class="form-group">
          <label>Followers Count</label>
          <input type="number" [(ngModel)]="microInfluencerData.followers_count" name="followers_count" />
        </div>

        <div class="form-group">
          <label>Engagement Rate (%)</label>
          <input type="number" step="0.01" [(ngModel)]="microInfluencerData.engagement_rate" name="engagement_rate" />
        </div>

        <div class="form-group">
          <label>Communication Style</label>
          <input type="text" [(ngModel)]="microInfluencerData.communication_style" name="communication_style" />
        </div>

        <div class="form-group">
          <label>Collaboration History</label>
          <textarea [(ngModel)]="microInfluencerData.collaboration_history" name="collaboration_history"></textarea>
        </div>

        <div class="form-group">
          <label>Describe Yourself / Storytelling</label>
          <textarea [(ngModel)]="microInfluencerData.describe_u" name="describe_u"></textarea>
        </div>
      </div>

      <div *ngIf="isInfluencer()">
        <h2>Influencer Details</h2>

        <div class="form-group">
          <label>Management Agency</label>
          <input type="text" [(ngModel)]="influencerData.management_agency" name="management_agency" />
        </div>

        <div class="form-group">
          <label>Main Niche</label>
          <input type="text" [(ngModel)]="influencerData.niche" name="niche" />
        </div>

        <div class="form-group">
          <label>Audience Country</label>
          <input type="text" [(ngModel)]="influencerData.audience_country" name="audience_country" />
        </div>
<div class="form-group">
  <label>Collaboration Types</label>
  <div class="multi-select">
    <label *ngFor="let type of allCollaborationTypes">
      <input type="checkbox" [value]="type" (change)="toggleSelection(influencerData.collaboration_types, $event)" />
      <span>{{ type }}</span>
    </label>
  </div>
</div>

        <div class="form-group">
          <label>Previous Brand Collaborations</label>
          <select [(ngModel)]="influencerData.previous_brand_collabs" name="previous_brand_collabs">
            <option [ngValue]="true">Yes</option>
            <option [ngValue]="false">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Pricing Range</label>
          <input type="text" [(ngModel)]="influencerData.pricing_range" name="pricing_range" />
        </div>

        <div class="form-group">
          <label>Average Reach</label>
          <input type="number" [(ngModel)]="influencerData.average_reach" name="average_reach" />
        </div>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button type="submit" [disabled]="loading">
        <span *ngIf="!loading">Sign Up</span>
        <span *ngIf="loading">Signing Up...</span>
      </button>
    </form>
  </div>
</div>
